description: >-
  FinOps view of Zeal embedded payroll spend. Zeal bills a per-employee-per-
  month (PEPM) and per-contractor-per-month fee for active paid workers on top
  of a platform / partner fee, with add-ons such as instant pay and paycards.
  Distinct from the platform subscription cost, the actual payroll dollars -
  disbursed wages plus employer taxes - flow through Zeal's funding reserve and
  should be tracked as a separate cost dimension. Test Mode moves no money and
  incurs no per-worker charges.
notes: >-
  Zeal pricing is sales-quoted and not public; reconcile PEPM, per-contractor,
  and platform-fee amounts against a signed order form. Track disbursed wages
  and employer tax liability separately from Zeal's own platform fees.
