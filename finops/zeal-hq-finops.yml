meters:
- name: active_paid_employees
  description: W-2 employees paid in the month, billed PEPM.
  unit: employees
  aggregation: count
  dimensions:
  - company
  - month
- name: active_paid_contractors
  description: 1099 contractors paid in the month, billed per contractor.
  unit: contractors
  aggregation: count
  dimensions:
  - company
  - month
- name: platform_fee
  description: Flat monthly platform / partner fee.
  unit: fee
  aggregation: sum
  dimensions:
  - partner
  - month
- name: instant_pay_transfers
  description: Instant pay transfers, an optional add-on billed per transfer or enrolled worker.
  unit: transfers
  aggregation: sum
  dimensions:
  - company
  - worker
- name: paycards
  description: Enrolled paycards, an optional add-on.
  unit: cards
  aggregation: count
  dimensions:
  - company
- name: disbursed_wages
  description: Gross wages and employer taxes moved through Zeal's funding reserve (payroll dollars, not platform fees).
  unit: usd
  aggregation: sum
  dimensions:
  - company
  - reporting_period
principles:
- name: Visibility
  description: Separate Zeal platform fees (PEPM, per-contractor, platform fee) from the payroll dollars moved through the funding reserve; pull the payroll journal and cash requirements reports per period.
- name: Allocation
  description: Tag spend by company and partner; map PEPM and per-contractor fees to the customer accounts that generate them.
- name: Optimization
  description: Run in Test Mode while integrating to avoid live charges; batch checks and reconcile inactive workers so you are not billed PEPM for workers who were not paid.
- name: Accountability
  description: Review the reserve balance and per-period cash requirements before each pay run; assign an owner for payroll funding and monthly Zeal invoice reconciliation.
