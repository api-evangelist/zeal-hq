aid: zeal-hq
url: https://raw.githubusercontent.com/api-evangelist/zeal-hq/refs/heads/main/apis.yml
name: Zeal
kind: company
description: Zeal is an embedded, payroll-as-a-service platform. Its API lets software
  companies build their own payroll products - onboarding companies, employees, and
  1099 contractors, running pay runs, disbursing pay, and handling tax calculation,
  filing, and compliance across all US jurisdictions - without becoming a payroll
  company themselves.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payroll
- Embedded Finance
- Fintech
- Tax Compliance
- Contractors
- Human Resources
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
