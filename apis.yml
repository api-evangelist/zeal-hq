description: Zeal is an embedded, payroll-as-a-service platform. Its API lets software
  companies build their own payroll products - onboarding companies, employees, and
  1099 contractors, running pay runs, disbursing pay, and handling tax calculation,
  filing, and compliance across all US jurisdictions - without becoming a payroll
  company themselves.
